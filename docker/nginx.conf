server {
  listen 80;
  location /v1/ {
    proxy_pass http://sentinel:8443/v1/;
  }
  location /mcp {
    proxy_pass http://sentinel:8443/mcp;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  location /health {
    proxy_pass http://sentinel:8443/health;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
