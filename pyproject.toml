[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "Adaptive Zero-Trust Security Control Plane for Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MCP-Sentinel" }]
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg2-binary==2.9.10",
  "redis==5.2.1",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "orjson==3.10.12",
  "jsonschema==4.23.0",
  "python-json-logger==3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
]
sandbox = [
  "docker==7.1.0",
]

[project.scripts]
mcp-sentinel = "sentinel.cli:main"
mcp-sentinel-demo = "sentinel.demo:main"

[tool.setuptools.packages.find]
include = [
  "sentinel*",
  "identity*",
  "policy*",
  "risk*",
  "monitoring*",
  "integrity*",
  "workflow*",
  "mfa*",
  "dataflow*",
  "sandbox*",
  "mcp_servers*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
